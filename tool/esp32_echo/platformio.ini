; Echo firmware for testing usb_serial_next on real hardware.
;   esp32dev     ESP32 dev board with a CH340 or CP2102 bridge (115200 baud)
;   t_display_s3 LilyGO T-Display-S3, native USB (CDC-ACM, any baud)
; Flash: pio run -e t_display_s3 -t upload

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

[env:esp32dev]
board = esp32dev

[env:t_display_s3]
board = lilygo-t-display-s3
