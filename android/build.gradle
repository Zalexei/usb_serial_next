group = "io.github.zalexei.usb_serial_next"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

// Kotlin. With AGP 9+ and built-in Kotlin (android.builtInKotlin not set to
// false) AGP compiles Kotlin itself and a plugin must not apply the Kotlin
// Gradle Plugin (KGP). Everywhere else KGP is needed, and Flutter before 3.44
// does not add it to plugins, so the plugin applies it there. This mirrors
// isBuiltInKotlinEnabled in Flutter's Gradle plugin. KGP is applied with
// pluginManager and not with "apply plugin:" on purpose: Flutter 3.44+ scans
// this file for that line, warns about it, and otherwise applies KGP itself
// when built-in Kotlin is off, which is harmless next to this (applying a
// plugin twice does nothing).
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize(".")[0].toInteger()
def builtInKotlinProperty = providers.gradleProperty("android.builtInKotlin").getOrNull()
def builtInKotlin = agpMajor >= 9 && (builtInKotlinProperty == null || builtInKotlinProperty.toBoolean())
if (!builtInKotlin) {
    pluginManager.apply("kotlin-android")
}

android {
    namespace = "io.github.zalexei.usb_serial_next"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
        // The vendored drivers are created by reflection; keep them in
        // minified release builds of the app.
        consumerProguardFiles("proguard-rules.pro")
    }

    dependencies {
        // Only for @IntDef in the vendored UsbSerialPort; not needed at run time.
        compileOnly("androidx.annotation:annotation:1.8.0")
        testImplementation("org.jetbrains.kotlin:kotlin-test")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

if (builtInKotlin) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
        }
    }
} else {
    android {
        kotlinOptions {
            jvmTarget = JavaVersion.VERSION_11
        }
    }
}
